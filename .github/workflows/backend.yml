name: CI Checks
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ner_test
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: ner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ner_test -d ner_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NER_TEST_DATABASE_URL: postgres://ner_test:ci-only-ephemeral-password@localhost:5432/ner_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go/go.sum
      - name: Go Race Detector
        run: go test -race ./...
        working-directory: backend/go
      - name: Go Vet
        run: go vet ./...
        working-directory: backend/go
      - name: Go Fmt Check
        run: test -z "$(gofmt -l .)"
        working-directory: backend/go
      - name: Go Full Test Suite
        run: go test -v ./...
        working-directory: backend/go

  python-and-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go/go.sum
      - name: Install Python Dependencies
        run: pip install -r backend/python/requirements-dev.txt -r backend/python/requirements-boosting.txt
      - name: Python Pytest
        run: python -m pytest -q
        working-directory: backend/python
      - name: Python Ruff Lint
        run: python -m ruff check .
        working-directory: backend/python
      - name: Smoke Python-Go Integration
        run: python scripts/smoke-python-go.py
      - name: Docker Build Go
        run: docker build -f backend/go/Dockerfile -t ner-backend-go:ci .
      - name: Docker Build Python
        run: docker build -f backend/python/Dockerfile -t ner-backend-python:ci .
      - name: Docker Compose Config Check
        run: docker compose config --quiet
        env:
          API_TOKEN: ci-only-ephemeral-token-longer-than-32-chars
          POSTGRES_PASSWORD: ci-only-ephemeral-password
      - name: Docker Compose Build
        run: docker compose build
        env:
          API_TOKEN: ci-only-ephemeral-token-longer-than-32-chars
          POSTGRES_PASSWORD: ci-only-ephemeral-password

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: npm ci
      - name: TypeScript Type Check
        run: npx tsc --noEmit
      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-anon-key-for-static-typecheck"
